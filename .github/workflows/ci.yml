# tsc runs locally only: the engine's API declaration file is laid into the
# gitignored .claude-plugin/types/ by the engine and is not committed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 2.1.289 is the engine the Claude desktop app bundles; it refuses a Button whose content is not a plain string
        claude-code: ['2.1.289', '2.1.295']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude-code }}
      - run: claude plugin validate .
      # validate --json reports gating hooks from 2.1.295 on
      - if: matrix.claude-code == '2.1.295'
        run: npm run check:gating
      - run: claude plugin test .
