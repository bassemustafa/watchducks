# tsc runs locally only: the engine's API declaration file is laid into the
# gitignored .claude-plugin/types/ by the engine and is not committed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code@2.1.295
      - run: claude plugin validate .
      - run: npm run check:gating
      - run: claude plugin test .
