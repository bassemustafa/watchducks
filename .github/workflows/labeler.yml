name: labeler

# pull_request_target runs with write access to the repository. That is safe
# here because this workflow checks out no pull request code and runs none:
# actions/labeler only reads the list of changed files from the API and reads
# its config (.github/labeler.yml) from the base branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
